name: SuiMove

permissions:
  contents: read
  pull-requests: write

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths:
      - '**.move'
      - '**Move.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mysten/sui-tools:testnet-v1.62.0
    steps:
      - uses: actions/checkout@v4

      - name: run Sui Move test
        run: bash ./contrib/run-move-tests.sh test

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # @v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install @mysten/prettier-plugin-move

      - run: bun prettier-move --config .prettier-move.json -c **/*.move
